name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish src/Whisper/Whisper.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output publish/${{ matrix.rid }}
      - name: Archive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "Whisper-${{ matrix.rid }}.zip"
      - name: Archive on Unix
        if: runner.os != 'Windows'
        run: cd "publish/${{ matrix.rid }}" && zip -r "../../Whisper-${{ matrix.rid }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: Whisper-${{ matrix.rid }}
          path: Whisper-${{ matrix.rid }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Whisper ${{ github.ref_name }}
          body: |
            ## Whisper 1.0.0

            Whisper is a private, offline speech-to-text app powered by Whisper. Transcribe audio files to text or subtitles, or capture live speech from a Linux microphone.

            ### Highlights
            - Full-screen, resize-aware terminal dashboard with themed pages and keyboard navigation.
            - Interactive model library with resumable downloads and live progress.
            - CPU and Vulkan GPU selection, plus a benchmark mode for comparing performance.
            - Multiple recognition languages, plain-text and SRT output, and live microphone transcription.

            ### Downloads
            Choose the archive for your platform: `linux-x64`, `win-x64`, `osx-x64`, or `osx-arm64`. Download a Whisper model separately after installation.

            FFmpeg is required for audio files. Linux microphone capture requires `arecord`.
          files: release-assets/*.zip
